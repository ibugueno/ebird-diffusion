data:
  dataset_root: /tmp/rgbe-gaze-smoke/dataset
  manifest_dir: /tmp/rgbe-gaze-smoke/manifests

model:
  image_size: 32
  in_channels: 1
  channels: [16, 32, 64]
  attention_resolutions: [8]
  time_embedding_dim: 64
  num_heads: 4
  dropout: 0.0
  gradient_checkpointing: false

diffusion:
  num_timesteps: 10
  beta_start: 0.0001
  beta_end: 0.02

training:
  output_dir: /tmp/rgbe-gaze-smoke/runs
  base_checkpoint: /tmp/rgbe-gaze-smoke/runs/image/checkpoints/best.pt
  conditional_checkpoint: /tmp/rgbe-gaze-smoke/runs/conditional/checkpoints/best.pt
  image_epochs: 1
  conditional_epochs: 1
  batch_size_per_gpu: 1
  gradient_accumulation_steps: 1
  mixed_precision: false
  gradient_clip: 1.0
  learning_rate: 0.0001
  weight_decay: 0.0
  num_workers: 0
  max_steps_per_epoch: 2
  seed: 44

sampling:
  split: test
  batch_size: 1
  limit: 1
  output_dir: /tmp/rgbe-gaze-smoke/samples
