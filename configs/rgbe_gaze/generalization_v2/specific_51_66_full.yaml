data:
  dataset_root: /app/Rislab_Event_influence_volume/dataset/rgbe-gaze
  manifest_dir: /app/Rislab_Event_influence_volume/rgbe-gaze/manifests/generalization-v2/full/specific-51-66

model:
  image_size: 512
  in_channels: 1
  channels: [32, 64, 128, 256, 512, 512]
  attention_resolutions: [32, 16]
  time_embedding_dim: 256
  num_heads: 4
  dropout: 0.0
  gradient_checkpointing: true

diffusion:
  num_timesteps: 1000
  beta_start: 0.0001
  beta_end: 0.02

training:
  output_dir: /app/Rislab_Event_influence_volume/rgbe-gaze/runs/generalization-v2/full/specific-51-66
  base_checkpoint: /app/Rislab_Event_influence_volume/rgbe-gaze/runs/generalization-v2/full/generic-1-50/image/checkpoints/best.pt
  conditional_init_checkpoint: /app/Rislab_Event_influence_volume/rgbe-gaze/runs/generalization-v2/full/generic-1-50/conditional/checkpoints/best.pt
  conditional_checkpoint: /app/Rislab_Event_influence_volume/rgbe-gaze/runs/generalization-v2/full/specific-51-66/conditional/checkpoints/best.pt
  image_epochs: 0
  conditional_epochs: 40
  batch_size_per_gpu: 3
  gradient_accumulation_steps: 9
  mixed_precision: true
  gradient_clip: 1.0
  learning_rate: 0.0001
  weight_decay: 0.0
  num_workers: 4
  seed: 44
  validation_seed: 10044
  checkpoint_every: 5

sampling:
  split: test
  batch_size: 1
  limit: 100
  seed: 44
  output_dir: /app/Rislab_Event_influence_volume/rgbe-gaze/samples/generalization-v2/full/specific-51-66
