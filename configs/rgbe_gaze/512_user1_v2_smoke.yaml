data:
  dataset_root: /app/Rislab_Event_influence_volume/dataset/rgbe-gaze
  manifest_dir: /app/Rislab_Event_influence_volume/rgbe-gaze/manifests-user-1-split

model:
  image_size: 512
  in_channels: 1
  channels: [32, 64, 128, 256, 512, 512]
  attention_resolutions: [32, 16]
  time_embedding_dim: 256
  num_heads: 4
  dropout: 0.0
  gradient_checkpointing: true

diffusion:
  num_timesteps: 1000
  beta_start: 0.0001
  beta_end: 0.02

training:
  output_dir: /app/Rislab_Event_influence_volume/rgbe-gaze/runs/512-user1-v2-smoke
  base_checkpoint: /app/Rislab_Event_influence_volume/rgbe-gaze/runs/512-user1-v2-smoke/image/checkpoints/best.pt
  conditional_checkpoint: /app/Rislab_Event_influence_volume/rgbe-gaze/runs/512-user1-v2-smoke/conditional/checkpoints/best.pt
  image_epochs: 1
  conditional_epochs: 1
  batch_size_per_gpu: 3
  gradient_accumulation_steps: 9
  mixed_precision: true
  gradient_clip: 1.0
  learning_rate: 0.0001
  weight_decay: 0.0
  num_workers: 4
  seed: 44
  validation_seed: 10044
  checkpoint_every: 1
  max_steps_per_epoch: 10

sampling:
  split: test
  batch_size: 1
  limit: 1
  seed: 44
  output_dir: /app/Rislab_Event_influence_volume/rgbe-gaze/samples/512-user1-v2-smoke
