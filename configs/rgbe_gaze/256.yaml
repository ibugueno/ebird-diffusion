data:
  dataset_root: /app/Rislab_Event_influence_volume/dataset/rgbe-gaze
  manifest_dir: /app/Rislab_Event_influence_volume/rgbe-gaze/manifests

model:
  image_size: 256
  in_channels: 1
  channels: [32, 64, 128, 256, 512]
  attention_resolutions: [32, 16]
  time_embedding_dim: 256
  num_heads: 4
  dropout: 0.0
  gradient_checkpointing: true

diffusion:
  num_timesteps: 1000
  beta_start: 0.0001
  beta_end: 0.02

training:
  output_dir: /app/Rislab_Event_influence_volume/rgbe-gaze/runs/256
  base_checkpoint: /app/Rislab_Event_influence_volume/rgbe-gaze/runs/256/image/checkpoints/best.pt
  conditional_checkpoint: /app/Rislab_Event_influence_volume/rgbe-gaze/runs/256/conditional/checkpoints/best.pt
  image_epochs: 100
  conditional_epochs: 100
  batch_size_per_gpu: 1
  gradient_accumulation_steps: 8
  mixed_precision: true
  gradient_clip: 1.0
  learning_rate: 0.0001
  weight_decay: 0.0
  num_workers: 4
  seed: 44

sampling:
  split: test
  batch_size: 1
  limit: 16
  output_dir: /app/Rislab_Event_influence_volume/rgbe-gaze/samples/256
